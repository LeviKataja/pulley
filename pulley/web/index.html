<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulley</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/">Pulley</a>
  <span class="tag" id="demo" hidden>Demo: nothing here is real</span>
  <ul class="tally label" id="tally" aria-label="Projects by state"></ul>
  <div class="right">
    <span class="facts label" id="facts"></span>
    <button class="btn" id="checkBtn" type="button">Check now</button>
  </div>
</header>

<div class="banners" id="banners" aria-live="polite"></div>

<main class="main">
  <section class="board" aria-label="Projects">
    <div class="cols label" aria-hidden="true">
      <span>State</span><span>Project</span><span>Running</span><span>Available</span><span>Container</span><span>Last update</span>
    </div>
    <div class="rows" id="rows"></div>
    <p class="empty" id="empty" hidden></p>
    <div class="rest"></div>
  </section>
  <section class="detail" id="detail" aria-label="The selected project"></section>
</main>

<footer class="foot label" id="foot"></footer>

<dialog id="askDlg" class="dlg">
  <form method="dialog">
    <h2 id="askTitle"></h2>
    <p id="askText"></p>
    <div class="dlg-actions">
      <button class="btn" value="no" type="submit">Cancel</button>
      <button class="btn go" id="askYes" value="yes" type="submit"></button>
    </div>
  </form>
</dialog>

<dialog id="logDlg" class="dlg wide">
  <form method="dialog">
    <h2 id="logTitle">Output</h2>
    <pre id="logText" class="out tall" tabindex="0"></pre>
    <div class="dlg-actions"><button class="btn" type="submit">Close</button></div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
